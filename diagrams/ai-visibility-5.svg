  <line x1="500" y1="180" x2="500" y2="230" stroke="#1f2a44" stroke-width="3" stroke-linecap="round" />
  <line x1="200" y1="330" x2="500" y2="330" stroke="#1f2a44" stroke-width="3" stroke-linecap="round" />

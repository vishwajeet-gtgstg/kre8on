<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" style="background-color:#faf8f2;">
  <text x="50%" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#1f2a44">Process for Registering a Private Limited Company in India</text>
  <rect x="100" y="80" width="220" height="100" rx="15" ry="15" stroke="#1f2a44" fill="none" stroke-width="3"/>
  <text x="210" y="125" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1f2a44">Choose Company Name</text>
  
  <rect x="400" y="80" width="220" height="100" rx="15" ry="15" stroke="#1f2a44" fill="none" stroke-width="3"/>
  <text x="510" y="125" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1f2a44">Obtain DIN and DSC</text>
  
  <rect x="100" y="220" width="220" height="100" rx="15" ry="15" stroke="#1f2a44" fill="none" stroke-width="3"/>
  <text x="210" y="265" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1f2a44">Incorporate Company</text>
  
  <rect x="400" y="220" width="220" height="100" rx="15" ry="15" stroke="#1f2a44" fill="none" stroke-width="3"/>
  <text x="510" y="265" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1f2a44">Obtain PAN and TAN</text>

  <rect x="250" y="360" width="300" height="100" rx="15" ry="15" stroke="#1f2a44" fill="none" stroke-width="3"/>
  <text x="400" y="405" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1f2a44">Open Company Bank Account</text>

  <line x1="210" y1="180" x2="400" y2="180" stroke="#1f2a44" stroke-width="3" stroke-linecap="round"/>
  <polygon points="400,180 390,175 390,185" fill="#1f2a44"/>
  
  <line x1="210" y1="250" x2="400" y2="250" stroke="#1f2a44" stroke-width="3" stroke-linecap="round"/>
  <polygon points="400,250 390,245 390,255" fill="#1f2a44"/>
  
  <line x1="400" y1="320" x2="250" y2="320" stroke="#1f2a44" stroke-width="3" stroke-linecap="round"/>
  <polygon points="250,320 260,315 260,325" fill="#1f2a44"/>
  
  <line x1="400" y1="320" x2="510" y2="320" stroke="#1f2a44" stroke-width="3" stroke-linecap="round"/>
  <polygon points="510,320 500,315 500,325" fill="#1f2a44"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" style="background-color:#faf8f2;">
  <text x="50%" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#1f2a44">GST Registration and Filing for E-Commerce Startups in India</text>
  
  <rect x="100" y="100" width="220" height="80" rx="15" ry="15" fill="none" stroke="#1f2a44" stroke-width="3"/>
  <text x="210" y="145" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1f2a44">Apply for GST Registration</text>

  <rect x="400" y="100" width="220" height="80" rx="15" ry="15" fill="none" stroke="#1f2a44" stroke-width="3"/>
  <text x="510" y="145" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1f2a44">Receive GSTIN</text>

  <rect x="100" y="240" width="220" height="80" rx="15" ry="15" fill="none" stroke="#1f2a44" stroke-width="3"/>
  <text x="210" y="275" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1f2a44">Maintain Records for Sales</text>

  <rect x="400" y="240" width="220" height="80" rx="15" ry="15" fill="none" stroke="#1f2a44" stroke-width="3"/>
  <text x="510" y="275" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1f2a44">File GST Returns</text>
  
  <rect x="250" y="375" width="300" height="80" rx="15" ry="15" fill="none" stroke="#1f2a44" stroke-width="3"/>
  <text x="400" y="410" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1f2a44">Pay GST Based on Filed Returns</text>

  <line x1="220" y1="100" x2="400" y2="140" stroke="#1f2a44" stroke-width="3" stroke-linecap="round"/>
  <line x1="220" y1="240" x2="400" y2="280" stroke="#1f2a44" stroke-width="3" stroke-linecap="round"/>
  <line x1="400" y1="320" x2="400" y2="375" stroke="#1f2a44" stroke-width="3" stroke-linecap="round"/>

  <polygon points="380,140 400,140 390,150" fill="#1f2a44"/>
  <polygon points="380,280 400,280 390,290" fill="#1f2a44"/>
  <polygon points="400,320 400,335 390,325" fill="#1f2a44"/>
</svg>
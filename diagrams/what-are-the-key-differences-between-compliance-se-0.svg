<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" style="background-color:#faf8f2;">
    <text x="50%" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#1f2a44">Compliance Services for Pvt Ltd vs LLP in India</text>
    
    <rect x="100" y="100" width="180" height="80" rx="15" fill="none" stroke="#1f2a44" stroke-width="3"/>
    <text x="190" y="150" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1f2a44">Private Limited Company</text>
    
    <rect x="450" y="100" width="180" height="80" rx="15" fill="none" stroke="#1f2a44" stroke-width="3"/>
    <text x="540" y="150" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1f2a44">Limited Liability Partnership</text>
    
    <rect x="100" y="250" width="180" height="80" rx="15" fill="none" stroke="#1f2a44" stroke-width="3"/>
    <text x="190" y="300" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1f2a44">Tax Compliance</text>
    
    <rect x="450" y="250" width="180" height="80" rx="15" fill="none" stroke="#1f2a44" stroke-width="3"/>
    <text x="540" y="300" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1f2a44">Regulatory Compliance</text>

    <rect x="250" y="380" width="300" height="80" rx="15" fill="none" stroke="#1f2a44" stroke-width="3"/>
    <text x="400" y="430" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1f2a44">Key Differences in Compliance</text>
    
    <line x1="280" y1="180" x2="280" y2="250" stroke="#1f2a44" stroke-width="3" stroke-linecap="round"/>
    <line x1="550" y1="180" x2="550" y2="250" stroke="#1f2a44" stroke-width="3" stroke-linecap="round"/>
    
    <line x1="190" y1="380" x2="280" y2="380" stroke="#1f2a44" stroke-width="3" stroke-linecap="round"/>
    <line x1="540" y1="380" x2="450" y2="380" stroke="#1f2a44" stroke-width="3" stroke-linecap="round"/>
</svg>
<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" style="background-color:#faf8f2;">
  <text x="50%" y="50" font-family="sans-serif" font-size="24" text-anchor="middle" fill="#1f2a44">Startup India Registration vs Standard Company Registration</text>
  <rect x="100" y="100" width="200" height="80" rx="15" ry="15" fill="none" stroke="#1f2a44" stroke-width="3"/>
  <text x="200" y="150" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#1f2a44">Startup India Registration</text>
  
  <rect x="500" y="100" width="200" height="80" rx="15" ry="15" fill="none" stroke="#1f2a44" stroke-width="3"/>
  <text x="600" y="150" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#1f2a44">Standard Company Registration</text>

  <rect x="100" y="250" width="200" height="80" rx="15" ry="15" fill="none" stroke="#1f2a44" stroke-width="3"/>
  <text x="200" y="300" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#1f2a44">Eligibility Criteria</text>

  <rect x="500" y="250" width="200" height="80" rx="15" ry="15" fill="none" stroke="#1f2a44" stroke-width="3"/>
  <text x="600" y="300" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#1f2a44">Documents Required</text>

  <rect x="300" y="380" width="200" height="80" rx="15" ry="15" fill="none" stroke="#1f2a44" stroke-width="3"/>
  <text x="400" y="430" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#1f2a44">Registration Process</text>

  <line x1="200" y1="180" x2="200" y2="250" stroke="#1f2a44" stroke-width="3" stroke-linecap="round"/>
  <line x1="600" y1="180" x2="600" y2="250" stroke="#1f2a44" stroke-width="3" stroke-linecap="round"/>
  <line x1="200" y1="340" x2="600" y2="340" stroke="#1f2a44" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowhead)"/>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1f2a44"/>
    </marker>
  </defs>
</svg>
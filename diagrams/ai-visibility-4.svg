<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" style="background-color:#faf8f2;">
  <text x="400" y="40" text-anchor="middle" font-size="24" fill="#1f2a44" font-family="sans-serif">AI Visibility Architecture</text>
  <rect x="150" y="100" width="200" height="80" rx="15" ry="15" fill="none" stroke="#1f2a44" stroke-width="3"/>
  <text x="250" y="145" text-anchor="middle" font-size="16" fill="#1f2a44" font-family="sans-serif">Data Sources</text>
  
  <rect x="450" y="100" width="200" height="80" rx="15" ry="15" fill="none" stroke="#1f2a44" stroke-width="3"/>
  <text x="550" y="145" text-anchor="middle" font-size="16" fill="#1f2a44" font-family="sans-serif">AI Model</text>
  
  <rect x="150" y="240" width="200" height="80" rx="15" ry="15" fill="none" stroke="#1f2a44" stroke-width="3"/>
  <text x="250" y="275" text-anchor="middle" font-size="16" fill="#1f2a44" font-family="sans-serif">Monitoring Tools</text>
  
  <rect x="450" y="240" width="200" height="80" rx="15" ry="15" fill="none" stroke="#1f2a44" stroke-width="3"/>
  <text x="550" y="275" text-anchor="middle" font-size="16" fill="#1f2a44" font-family="sans-serif">Visualization Dashboard</text>

  <rect x="275" y="360" width="250" height="80" rx="15" ry="15" fill="none" stroke="#1f2a44" stroke-width="3"/>
  <text x="400" y="395" text-anchor="middle" font-size="16" fill="#1f2a44" font-family="sans-serif">User Feedback Loop</text>

  <line x1="250" y1="180" x2="450" y2="180" stroke="#1f2a44" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line x1="250" y1="220" x2="250" y2="240" stroke="#1f2a44" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line x1="550" y1="220" x2="550" y2="240" stroke="#1f2a44" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line x1="350" y1="320" x2="350" y2="360" stroke="#1f2a44" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refx="0" refy="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1f2a44"/>
    </marker>
  </defs>
</svg>
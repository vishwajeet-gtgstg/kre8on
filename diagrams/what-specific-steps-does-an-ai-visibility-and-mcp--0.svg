  <rect x="50" y="80" width="180" height="80" rx="15" ry="15" fill="none" stroke="#1f2a44" stroke-width="3" />
  <text x="140" y="120" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#1f2a44">Identify Customer Needs</text>
  
  <rect x="300" y="80" width="180" height="80" rx="15" ry="15" fill="none" stroke="#1f2a44" stroke-width="3" />
  <text x="390" y="120" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#1f2a44">Optimize ChatGPT Interface</text>
  
  <rect x="550" y="80" width="180" height="80" rx="15" ry="15" fill="none" stroke="#1f2a44" stroke-width="3" />
  <text x="640" y="120" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#1f2a44">Implement Localization</text>
  

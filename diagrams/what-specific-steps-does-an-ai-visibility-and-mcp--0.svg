  <text x="240" y="280" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#1f2a44">Monitor Response Quality</text>
  
  <rect x="400" y="240" width="180" height="80" rx="15" ry="15" fill="none" stroke="#1f2a44" stroke-width="3" />
  <text x="490" y="280" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#1f2a44">Analyze Customer Feedback</text>

  <line x1="230" y1="160" x2="300" y2="120" stroke="#1f2a44" stroke-width="3" stroke-linecap="round"/>
  <line x1="480" y1="160" x2="550" y2="120" stroke="#1f2a44" stroke-width="3" stroke-linecap="round"/>
  <line x1="240" y1="200" x2="240" y2="240" stroke="#1f2a44" stroke-width="3" stroke-linecap="round"/>
  <line x1="490" y1="200" x2="490" y2="240" stroke="#1f2a44" stroke-width="3" stroke-linecap="round"/>
  <line x1="300" y1="200" x2="400" y2="280" stroke="#1f2a44" stroke-width="3" stroke-linecap="round"/>
</svg>